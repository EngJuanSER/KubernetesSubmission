name: GitOps - Log Output

on:
  push:
    branches:
      - main
    paths:
      - 'log_output/**'

jobs:
  build-and-release:
    name: Build and Update GitOps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push log-output-writer
        run: |-
          docker build --tag "engjuanser/log-output-writer:$GITHUB_SHA" ./log_output/writer
          docker push "engjuanser/log-output-writer:$GITHUB_SHA"
      
      - name: Build and push log-output-reader
        run: |-
          docker build --tag "engjuanser/log-output:$GITHUB_SHA" ./log_output/reader
          docker push "engjuanser/log-output:$GITHUB_SHA"
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      
      - name: Update images in kustomization
        run: |-
          kustomize edit set image engjuanser/log-output-writer=engjuanser/log-output-writer:$GITHUB_SHA
          kustomize edit set image engjuanser/log-output=engjuanser/log-output:$GITHUB_SHA
      
      - name: Commit kustomization.yaml
        uses: EndBug/add-and-commit@v9
        with:
          add: 'kustomization.yaml'
          message: 'GitOps: Update log-output images to ${{ github.sha }}'
