name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'todo_backend/**'
      - 'todo_frontend/**'
      - 'broadcaster/**'

jobs:
  build-and-deploy-staging:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push images
        run: |-
          docker build --tag "engjuanser/todo-backend:$GITHUB_SHA" ./todo_backend
          docker push "engjuanser/todo-backend:$GITHUB_SHA"
          
          docker build --tag "engjuanser/todo-frontend:$GITHUB_SHA" ./todo_frontend
          docker push "engjuanser/todo-frontend:$GITHUB_SHA"
          
          docker build --tag "engjuanser/todo-broadcaster:$GITHUB_SHA" ./broadcaster
          docker push "engjuanser/todo-broadcaster:$GITHUB_SHA"
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      
      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: EngJuanSER/KubernetesConfig
          token: ${{ secrets.GH_PAT }}
          path: config
      
      - name: Update staging images
        working-directory: ./config/todo_project/overlays/staging
        run: |-
          kustomize edit set image PROJECT/BACKEND=engjuanser/todo-backend:$GITHUB_SHA
          kustomize edit set image PROJECT/FRONTEND=engjuanser/todo-frontend:$GITHUB_SHA
          kustomize edit set image PROJECT/BROADCASTER=engjuanser/todo-broadcaster:$GITHUB_SHA
      
      - name: Commit and push to config repository
        working-directory: ./config
        run: |-
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add todo_project/overlays/staging/kustomization.yaml
          git commit -m "Deploy staging: ${{ github.sha }}"
          git push
