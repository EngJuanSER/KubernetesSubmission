name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy-production:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push images with tag
        run: |-
          TAG=${GITHUB_REF#refs/tags/}
          
          docker build --tag "engjuanser/todo-backend:$TAG" ./todo_backend
          docker push "engjuanser/todo-backend:$TAG"
          
          docker build --tag "engjuanser/todo-frontend:$TAG" ./todo_frontend
          docker push "engjuanser/todo-frontend:$TAG"
          
          docker build --tag "engjuanser/todo-broadcaster:$TAG" ./broadcaster
          docker push "engjuanser/todo-broadcaster:$TAG"
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      
      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: EngJuanSER/KubernetesConfig
          token: ${{ secrets.GH_PAT }}
          path: config
      
      - name: Update production images
        working-directory: ./config/todo_project/overlays/production
        run: |-
          TAG=${GITHUB_REF#refs/tags/}
          kustomize edit set image PROJECT/BACKEND=engjuanser/todo-backend:$TAG
          kustomize edit set image PROJECT/FRONTEND=engjuanser/todo-frontend:$TAG
          kustomize edit set image PROJECT/BROADCASTER=engjuanser/todo-broadcaster:$TAG
      
      - name: Commit and push to config repository
        working-directory: ./config
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |-
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add todo_project/overlays/production/kustomization.yaml
          git commit -m "Deploy production: ${GITHUB_REF#refs/tags/}"
          git push https://$GH_TOKEN@github.com/EngJuanSER/KubernetesConfig.git main
