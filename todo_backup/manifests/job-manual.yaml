apiVersion: batch/v1
kind: Job
metadata:
  name: todo-backup-manual
  namespace: project
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: backup
        image: engjuanser/todo-backup:1.0
        env:
        - name: POSTGRES_HOST
          value: postgres-svc
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: GCS_BUCKET_NAME
          value: dwk-todo-backups-devopskub
