apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EngJuanSER/KubernetesSubmission
    path: todo_project
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
